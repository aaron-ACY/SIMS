name: Frontend CI

on:
  push:
    branches: [main, Test]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, Test]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Hiện có 133 lỗi eslint sẵn trong repo (phần lớn là 'React' unused —
      # React 19 không cần import React để dùng JSX). Để non-blocking cho tới
      # khi dọn xong, rồi đổi thành `run: npm run lint` để bật gate.
      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Build
        env:
          # Không phải secret, chỉ là base URL. Override bằng repo variable
          # VITE_API_BASE_URL nếu cần trỏ tới môi trường khác.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'http://localhost:5000' }}
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 14
